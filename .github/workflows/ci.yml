name: Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Start dependencies
        run: docker compose up -d postgres redis
      - name: Wait for dependencies
        run: |
          for i in {1..30}; do
            docker compose ps | grep -q "Up" && break
            sleep 2
          done
      - name: Run tests
        run: chmod +x gradlew && ./gradlew test --no-daemon --console=plain
