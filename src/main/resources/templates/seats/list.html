<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좌석 선택 | Gate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><nav class="nav"><a href="/slots">Gate</a><a href="/my-reservations">내 예약</a></nav><p class="eyebrow">SELECT YOUR SEAT</p><h1 th:text="${slot.name}">10시 입장</h1><p>원하는 좌석을 선택하세요. 회색 좌석은 이미 예약되었습니다.</p><div class="stage">STAGE</div><form method="post" action="/reservations/auto" class="auto-form"><input type="hidden" name="slotId" th:value="${slot.id}"><button type="submit" class="button-link">자동배정 받기</button></form><div class="seat-grid"><form th:each="seat : ${seats}" method="post" action="/payment"><input type="hidden" name="slotId" th:value="${slot.id}"><input type="hidden" name="seatId" th:value="${seat.id}"><button class="seat" th:classappend="${seat.reserved} ? ' reserved' : ''" th:disabled="${seat.reserved}" type="submit" th:text="${seat.label}">1-A</button></form></div></main></body></html>
