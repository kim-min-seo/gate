spring.application.name=gate
spring.datasource.url=jdbc:postgresql://localhost:5432/gate
spring.datasource.username=gate
spring.datasource.password=gate

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.servlet.session.timeout=30m
management.endpoints.web.exposure.include=health,info,metrics
gate.admin.email=${GATE_ADMIN_EMAIL:}

# Shared server-side sessions survive application restarts. Expiration is idle time.
spring.session.timeout=30m
spring.session.redis.namespace=gate:session
server.servlet.session.cookie.name=GATE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
