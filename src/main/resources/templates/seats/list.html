<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좌석 선택 | Gate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><nav class="nav"><a href="/slots">Gate</a><a href="/my-reservations">내 예약</a></nav><p class="eyebrow">SELECT YOUR SEAT</p><h1 th:text="${slot.name}">10시 입장</h1><p>원하는 좌석을 선택하세요. 회색 좌석은 이미 예약되었습니다.</p><div class="stage">STAGE</div><form method="post" action="/reservations/auto" class="auto-form"><input type="hidden" name="slotId" th:value="${slot.id}"><label>자동배정 매수 <select name="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button type="submit" class="button-link">자동배정 받기</button></form><form method="post" action="/payment"><div class="seat-grid"><th:block th:each="seat : ${seats}"><label class="seat-choice"><input type="checkbox" name="seatIds" th:value="${seat.id}" th:disabled="${seat.reserved}"><span class="seat" th:classappend="${seat.reserved} ? ' : '" th:text="${seat.label}">1-A</span></label></th:block></div><input type="hidden" name="slotId" th:value="${slot.id}"><button class="primary-button" type="submit">선택한 좌석 예매하기</button></form></main></body></html>
