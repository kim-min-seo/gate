<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬롯 목록 | Gate</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <p class="eyebrow">GATE RESERVATION</p>
    <h1>예약 가능한 슬롯</h1>
    <nav class="nav"><a href="/">Gate</a><span th:if="${session.userEmail}" th:text="${session.userEmail}"></span><a th:if="${session.userEmail}" href="/my-reservations">내 예약</a><a th:if="${session.userEmail == null}" href="/login">로그인</a><a th:if="${session.userEmail == null}" href="/signup">회원가입</a><form th:if="${session.userEmail}" method="post" action="/logout"><button class="link-button" type="submit">로그아웃</button></form></nav>
    <p class="status" th:if="${message}" th:text="${message}"></p>
    <section class="card" th:if="${#lists.isEmpty(slots)}">
        <p>등록된 슬롯이 없습니다.</p>
    </section>
    <section class="card" th:each="slot : ${slots}">
        <h2 th:text="${slot.name}">10시 입장</h2>
        <p th:text="|정원 ${slot.capacity}명 · 남은 자리 ${slot.remaining}명|">정원 100명 · 남은 자리 100명</p>
        <p th:text="${slot.startsAt}">2026-09-10T10:00</p>
        <form method="post" action="/reservations">
            <input type="hidden" name="slotId" th:value="${slot.id}">
            <a class="button-link" th:href="@{/slots/{id}/seats(id=${slot.id})}">좌석 선택하기</a>
        </form>
    </section>
</main>
</body>
</html>
