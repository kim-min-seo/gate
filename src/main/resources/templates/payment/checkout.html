<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 | Gate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><nav class="nav"><b class="brand">GATE<span>.</span></b><a href="/slots">예약으로 돌아가기</a></nav><p class="eyebrow">PAYMENT</p><h1>예약 결제</h1><section class="card"><p><b th:text="${slot.name}">10시 입장</b></p><p>선택 좌석 <b th:text="${#lists.size(seatIds)} + '개'">1개</b></p><p class="price" th:text="${#lists.size(seatIds) * 10000} + '원'">10,000원</p><form method="post" action="/reservations"><input type="hidden" name="slotId" th:value="${slot.id}"><input type="hidden" name="seatIds" th:each="id : ${seatIds}" th:value="${id}"><div class="payment-options"><label><input type="radio" name="paymentMethod" value="card" checked> 신용/체크카드</label><div class="card-fields"><input name="cardNumber" inputmode="numeric" maxlength="19" placeholder="카드번호 16자리"><div><input name="expiry" placeholder="MM/YY" maxlength="5"><input name="cvc" inputmode="numeric" placeholder="CVC 3자리" maxlength="3"></div></div><label><input type="radio" name="paymentMethod" value="phone"> 휴대폰 결제</label><div class="card-fields"><input name="phoneNumber" placeholder="휴대폰 번호 (01012345678)"></div><label><input type="radio" name="paymentMethod" value="transfer"> 무통장입금</label><div class="card-fields"><p>국민은행 123-456-7890 (Gate)</p><input name="depositor" placeholder="입금자명"></div></div><button class="primary-button" type="submit">결제하고 예매하기</button></form></section></main></body></html>
