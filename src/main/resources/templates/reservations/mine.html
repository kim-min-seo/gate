<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 예약 | Gate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="container narrow"><nav class="nav"><a href="/slots">Gate</a><a href="/slots">슬롯 보기</a><form method="post" th:action="@{/logout}"><button class="link-button" type="submit">로그아웃</button></form></nav><p class="eyebrow">MY RESERVATIONS</p><h1>내 예약</h1><p class="status" th:if="${message}" th:text="${message}"></p><section class="card" th:if="${#lists.isEmpty(reservations)}"><p>아직 예약이 없습니다.</p></section><section class="card" th:each="reservation : ${reservations}"><h2 th:text="${reservation.slot.name}">10시 입장</h2><p th:text="|상태: ${reservation.status}|">상태: HELD</p><p th:text="${reservation.createdAt}">2026-09-09T10:00</p><p th:if="${reservation.seat != null}">좌석: <b th:text="${reservation.seat.label}">1-A</b></p><form th:if="${reservation.status.name() == 'HELD' || reservation.status.name() == 'CONFIRMED'}" method="post" th:action="@{/reservations/cancel}" onsubmit="return confirm('정말 이 예약을 취소하시겠습니까?');"><input type="hidden" name="reservationId" th:value="${reservation.id}"><button type="submit" class="cancel-button">예약 취소</button></form></section><section class="card" th:each="recovery : ${recoveries}"><h2>결제 상태 확인</h2><p th:text="|주문번호: ${recovery.orderId}|"></p><p th:text="${recovery.status == 'PENDING' ? '결제 결과를 확인 중입니다. 중복 결제하지 말고 잠시 후 다시 확인해 주세요.' : '자동 확인이 완료되지 않았습니다. 주문번호와 함께 관리자에게 문의해 주세요.'}"></p></section><h2>결제 내역</h2><section class="card" th:if="${#lists.isEmpty(payments)}"><p>결제 내역이 없습니다.</p></section><section class="card" th:each="payment : ${payments}"><p><b th:text="${payment.amount} + '원'">20,000원</b></p><p th:text="|주문번호: ${payment.orderId}|">주문번호</p><p th:text="|상태: ${payment.status}|">상태: APPROVED</p><p th:text="${payment.approvedAt}">승인 시각</p></section></main></body></html>
