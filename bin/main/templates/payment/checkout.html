<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 | Gate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><nav class="nav"><a href="/slots">Gate</a><a href="/my-reservations">내 예약</a></nav><p class="eyebrow">PAYMENT</p><h1>예약 결제</h1><section class="card"><p><b th:text="${slot.name}">10시 입장</b></p><p>좌석: <b th:text="${seat.label}">1-A</b></p><p class="price">10,000원</p><form method="post" action="/reservations"><input type="hidden" name="slotId" th:value="${slot.id}"><input type="hidden" name="seatId" th:value="${seat.id}"><div class="payment-options"><label><input type="radio" name="paymentMethod" value="card" checked><span>신용/체크카드</span></label><label><input type="radio" name="paymentMethod" value="easy"><span>간편결제</span></label><label><input type="radio" name="paymentMethod" value="transfer"><span>무통장입금</span></label></div><button class="primary-button" type="submit">결제하고 예약하기</button></form></section></main></body></html>
