<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>예약하기 | Gate</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><nav class="nav"><b class="brand">GATE<span>.</span></b><a href="/">홈</a><span class="nav-spacer"></span><span th:if="${session.userEmail}" class="user-chip" th:text="${session.userEmail}"></span><a th:if="${session.userEmail}" href="/my-reservations">내 예약</a><form th:if="${session.userEmail}" method="post" action="/logout"><button class="link-button" type="submit">로그아웃</button></form><a th:if="${session.userEmail == null}" href="/login">로그인</a></nav><section class="page-heading"><p class="eyebrow">CHOOSE YOUR MOMENT</p><h1>예약 가능한 시간</h1><p>원하는 입장 시간을 선택하고 자리를 확보하세요.</p></section><p class="status" th:if="${message}" th:text="${message}"></p><form class="date-picker" method="get" action="/slots"><label>예약 날짜<select name="date" onchange="this.form.submit()"><option th:each="date : ${dates}" th:value="${date}" th:text="${date}" th:selected="${date.equals(selectedDate)}"></option></select></label></form><section class="slot-grid"><article class="slot-card" th:each="slot : ${slots}"><div class="slot-top"><span class="slot-dot"></span><span>AVAILABLE</span></div><h2 th:text="${slot.name}">10시 입장</h2><p class="slot-date" th:text="${slot.startsAt}">2026-09-20T10:00</p><div class="capacity"><span>남은 자리</span><b th:text="${slot.remaining} + ' / ' + ${slot.capacity}">100 / 100</b></div><a class="button-link" th:href="@{/slots/{id}/seats(id=${slot.id})}">좌석 선택하기 <span>→</span></a></article></section></main></body></html>
